<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Achadora</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>

  <button class="settings-btn" id="settings-btn" aria-label="Configurações">⚙️</button>

  <nav class="tabbar">
    <button data-tab="catalogo" class="active"><span class="ic">🔎</span>Catálogo</button>
    <button data-tab="favoritos"><span class="ic">⭐</span>Favoritos</button>
    <button class="scan-btn" id="scan-btn" aria-label="Escanear produto">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <button data-tab="listas"><span class="ic">🧾</span>Listas</button>
    <button data-tab="lojas"><span class="ic">🏪</span>Lojas</button>
  </nav>

  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
